<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bookCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C25E2E"/>
      <stop offset="100%" stop-color="#9C441A"/>
    </linearGradient>
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F4EFEB"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#3d2212" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#FAF8F5" stroke="#E6DFD3" stroke-width="2"/>

  <!-- Book spine and cover -->
  <g filter="url(#softShadow)">
    <!-- Book Base / Cover -->
    <path d="M12 18 C12 15 15 14 18 14 L46 14 C49 14 52 15 52 18 L52 48 C52 51 49 52 46 52 L18 52 C15 52 12 51 12 48 Z" fill="url(#bookCover)"/>
    
    <!-- Spine Accent line -->
    <path d="M18 14 L18 52" stroke="#7E3310" stroke-width="2"/>

    <!-- Paper Block (left page) -->
    <path d="M20 18 C25 19 29 19 32 20 L32 48 C29 47 25 47 20 46 Z" fill="url(#paperGrad)" stroke="#E2DAC9" stroke-width="0.8"/>

    <!-- Paper Block (right page) -->
    <path d="M32 20 C35 19 39 19 44 18 L44 46 C39 47 35 47 32 48 Z" fill="url(#paperGrad)" stroke="#E2DAC9" stroke-width="0.8"/>
    
    <!-- Text Lines Left -->
    <line x1="23" y1="24" x2="29" y2="24.8" stroke="#D1C7B5" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="23" y1="29" x2="29" y2="29.8" stroke="#D1C7B5" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="23" y1="34" x2="28" y2="34.7" stroke="#D1C7B5" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="23" y1="39" x2="29" y2="39.8" stroke="#D1C7B5" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Text Lines Right -->
    <line x1="35" y1="24.8" x2="41" y2="24" stroke="#D1C7B5" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="35" y1="29.8" x2="41" y2="29" stroke="#D1C7B5" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="35" y1="34.7" x2="40" y2="34" stroke="#D1C7B5" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="35" y1="39.8" x2="41" y2="39" stroke="#D1C7B5" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Bookmark Ribbon -->
    <path d="M30 14 L30 33 L32 30 L34 33 L34 14 Z" fill="#D97706"/>
  </g>
</svg>